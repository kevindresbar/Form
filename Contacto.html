        <form action="">
            <h1>Contacto</h1>
            <fieldset>
                <legend>Información Personal</legend>

                <label for="Name">Nombre:</label>
                <input type="text" placeholder="Tu Nombre" id="name">

                <label for="LastName">Apellido</label>
                <input type="text" placeholder="Tu Apellido" id="LastName">

                <label for="PhoneNumber">Telefono Celular</label>
                <input type="number" placeholder="Tu Numero de celular" id="PhoneNumber">

                <label for="Mail">Correo Eletronico</label>
                <input type="email" placeholder="**********@example.com" id="Mail">
            </fieldset>
            <fieldset>
                <legend>Comentarios</legend>

                <label for="comment"></label>
                <textarea name="" placeholder="QUE SEAN POSITIVO!!!!!" id="comment"></textarea>

            </fieldset>
            <button>Enviar</button>
        </form>
